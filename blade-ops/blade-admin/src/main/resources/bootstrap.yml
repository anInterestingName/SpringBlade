server:
  port: 7002
  tomcat:
    # 线程配置
    threads:
      # 最大工作线程数(可同时处理请求的线程上限)
      max: 400
      # 最小空闲工作线程数(保持存活的常驻线程数)
      min-spare: 16

spring:
  boot:
    admin:
      discovery:
        ignored-services:
          - consul
          - serverAddr
#      monitor:
#        # 给服务冷启动和外部依赖健康检查留出响应时间。
#        status-interval: 30s
#        status-lifetime: 30s
#        default-timeout: 20s

management:
  endpoints:
    web:
      discovery:
        enabled: false
