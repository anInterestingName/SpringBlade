name: Build and publish SpringBlade images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: springblade-image-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package services
        run: mvn -B clean package -DskipTests -Ddocker.skip=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: image_meta
        shell: bash
        run: |
          echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image_owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push service images
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image_meta.outputs.image_tag }}
          IMAGE_OWNER: ${{ steps.image_meta.outputs.image_owner }}
        run: |
          services=(
            "blade-auth:blade-auth"
            "blade-gateway:blade-gateway"
            "blade-admin:blade-ops/blade-admin"
            "blade-develop:blade-ops/blade-develop"
            "blade-report:blade-ops/blade-report"
            "blade-resource:blade-ops/blade-resource"
            "blade-desk:blade-service/blade-desk"
            "blade-log:blade-service/blade-log"
            "blade-system:blade-service/blade-system"
            "blade-ai:blade-service/blade-ai"
          )
          for item in "${services[@]}"; do
            image_name="${item%%:*}"
            context="${item#*:}"
            docker buildx build \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --tag "${REGISTRY}/${IMAGE_OWNER}/${image_name}:${IMAGE_TAG}" \
              --push \
              "$context"
          done
