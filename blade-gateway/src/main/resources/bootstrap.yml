server:
  port: ${BFF_PORT:80}

spring:
  cloud:
    discovery:
      enabled: ${GATEWAY_LEGACY_ROUTING_ENABLED:false}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: ${GATEWAY_LEGACY_ROUTING_ENABLED:false}
    loadbalancer:
      retry:
        enabled: true


