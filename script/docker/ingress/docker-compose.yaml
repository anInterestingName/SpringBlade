name: springblade-ingress

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - ${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80
      - ${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIRECTORY:?配置仓库外TLS证书目录}:/etc/nginx/tls:ro
    environment:
      PUBLIC_SERVER_NAME: ${PUBLIC_SERVER_NAME:?配置统一入口域名}
      SABER_UPSTREAM: ${SABER_UPSTREAM:?配置可达的Saber静态服务URL}
      NGINX_ENVSUBST_FILTER: "^(PUBLIC_SERVER_NAME|SABER_UPSTREAM)$"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - springblade-platform

networks:
  springblade-platform:
    external: true
    name: springblade-platform
