# Nginx 官方镜像通过 envsubst 生成 conf.d/default.conf；只替换 Compose 指定变量。
# 日志不记录查询串、Referer、Cookie 或 Authorization。
log_format auth_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log auth_safe;
error_log /var/log/nginx/error.log crit;
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name ${PUBLIC_SERVER_NAME};
    location = /healthz { access_log off; return 200 "ok"; }
    location / { return 308 https://${PUBLIC_SERVER_NAME}$request_uri; }
}

server {
    listen 443 ssl;
    server_name ${PUBLIC_SERVER_NAME};
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;

    # 覆盖客户端传入的代理信息，只承接本入口终止的HTTPS。
    proxy_set_header Host ${PUBLIC_SERVER_NAME};
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host ${PUBLIC_SERVER_NAME};
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_buffering off;
    set $bff http://blade-gateway:80;
    set $authorization http://blade-authorization-server:8100;
    set $saber ${SABER_UPSTREAM};

    location = /healthz { access_log off; return 200 "ok"; }
    location = /oauth2/authorization/blade { limit_except GET { deny all; } proxy_pass $bff; }
    location = /login/oauth2/code/blade { limit_except GET { deny all; } proxy_pass $bff; }
    location /bff/ { proxy_pass $bff; }
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $bff$uri$is_args$args;
    }
    location = /auth-api/ui/login-context { limit_except GET { deny all; } proxy_pass $authorization/ui/login-context$is_args$args; }
    location = /auth-api/ui/consent { limit_except GET { deny all; } proxy_pass $authorization/ui/consent$is_args$args; }
    location = /auth-api/login { limit_except POST { deny all; } proxy_pass $authorization/login$is_args$args; }
    location = /auth-api/oauth2/authorize { limit_except POST { deny all; } proxy_pass $authorization/oauth2/authorize$is_args$args; }
    location /auth-api/ { return 404; }
    location = /.well-known/openid-configuration { limit_except GET { deny all; } proxy_pass $authorization; }
    location = /.well-known/oauth-authorization-server { limit_except GET { deny all; } proxy_pass $authorization; }
    location = /oauth2/authorize { limit_except GET POST { deny all; } proxy_pass $authorization; }
    location = /oauth2/token { limit_except POST { deny all; } proxy_pass $authorization; }
    location = /oauth2/jwks { limit_except GET { deny all; } proxy_pass $authorization; }
    location = /oauth2/revoke { limit_except POST { deny all; } proxy_pass $authorization; }
    location = /oauth2/introspect { limit_except POST { deny all; } proxy_pass $authorization; }
    location = /userinfo { limit_except GET POST { deny all; } proxy_pass $authorization; }
    location = /login { limit_except GET POST { deny all; } proxy_pass $authorization; }
    location /oauth2/ { return 404; }
    location /blade-auth/ { return 410; }
    location /actuator/ { return 404; }
    location / { proxy_pass $saber; }
}
