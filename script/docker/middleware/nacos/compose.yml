services:
  nacos:
    image: nacos/nacos-server:v3.2.2
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - exec 9>/dev/null; export BASH_XTRACEFD=9; exec bash /home/nacos/bin/docker-startup.sh
    environment:
      MODE: standalone
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_DATABASE_NUM: 1
      MYSQL_SERVICE_HOST: ${MYSQL_SERVICE_HOST:-springblade-mysql}
      MYSQL_SERVICE_PORT: ${MYSQL_SERVICE_PORT:-3306}
      MYSQL_SERVICE_DB_NAME: ${MYSQL_SERVICE_DB_NAME:-nacos_config}
      MYSQL_SERVICE_USER: ${MYSQL_SERVICE_USER:-nacos}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_SERVICE_PASSWORD}
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_CACHE_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AI_PIPELINE_ENABLED: "false"
      NACOS_AI_PIPELINE_SKILL_SCANNER_ENABLED: "false"
      NACOS_EXTENSION_AI_ENABLED: "false"
    ports:
      - ${NACOS_BIND_ADDRESS:-127.0.0.1}:${NACOS_SERVER_PORT:-8848}:8848
      - ${NACOS_BIND_ADDRESS:-127.0.0.1}:${NACOS_GRPC_PORT:-9848}:9848
      - ${NACOS_BIND_ADDRESS:-127.0.0.1}:${NACOS_CONSOLE_HOST_PORT:-18080}:8080
    volumes:
      - ./data:/home/nacos/data
      - ./logs:/home/nacos/logs
      - ./conf/application.properties:/home/nacos/conf/application.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8848; exec 3>&-; exec 3<>/dev/tcp/127.0.0.1/8080; exec 3>&-'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      springblade-backend:
        aliases:
          - springblade-nacos

networks:
  springblade-backend:
    external: true
