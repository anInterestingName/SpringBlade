name: springblade-gateway

services:
  blade-gateway:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/blade-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-640m}
    mem_reservation: ${GATEWAY_MEMORY_RESERVATION:-384m}
    cpus: ${GATEWAY_CPUS:-1.0}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx256m -Xss512k -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MaxDirectMemorySize=128m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
      BLADE_NACOS_ADDR: ${BLADE_NACOS_ADDR}
      BLADE_NACOS_NAMESPACE: ${BLADE_NACOS_NAMESPACE:-prod}
      BLADE_NACOS_USERNAME: ${BLADE_NACOS_USERNAME}
      BLADE_NACOS_PASSWORD: ${BLADE_NACOS_PASSWORD}
      BLADE_SENTINEL_ADDR: ${BLADE_SENTINEL_ADDR}
      BLADE_REDIS_HOST: ${BLADE_REDIS_HOST}
      BLADE_REDIS_PORT: ${BLADE_REDIS_PORT:-6379}
      BLADE_REDIS_PASSWORD: ${BLADE_REDIS_PASSWORD}
      BLADE_REDIS_DATABASE: ${BLADE_REDIS_DATABASE:-0}
      BLADE_TOKEN_SIGN_KEY: ${BLADE_TOKEN_SIGN_KEY}
      BLADE_TOKEN_CRYPTO_KEY: ${BLADE_TOKEN_CRYPTO_KEY}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${DISCOVERY_IP:?DISCOVERY_IP is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: ${DISCOVERY_PORT:-80}
    ports:
      - ${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:80
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    networks:
      springblade-ingress:
        aliases:
          - blade-gateway

networks:
  springblade-ingress:
    external: true
    name: springblade-ingress
