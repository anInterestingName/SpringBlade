name: springblade-ai

services:
  blade-ai:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/blade-ai:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${AI_MEMORY_LIMIT:-896m}
    mem_reservation: ${AI_MEMORY_RESERVATION:-640m}
    cpus: ${AI_CPUS:-1.0}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx512m -Xss512k -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MaxDirectMemorySize=128m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
      BLADE_NACOS_ADDR: ${BLADE_NACOS_ADDR:?BLADE_NACOS_ADDR is required}
      BLADE_NACOS_NAMESPACE: ${BLADE_NACOS_NAMESPACE:-prod}
      BLADE_NACOS_USERNAME: ${BLADE_NACOS_USERNAME:?BLADE_NACOS_USERNAME is required}
      BLADE_NACOS_PASSWORD: ${BLADE_NACOS_PASSWORD:?BLADE_NACOS_PASSWORD is required}
      BLADE_SENTINEL_ADDR: ${BLADE_SENTINEL_ADDR:?BLADE_SENTINEL_ADDR is required}
      BLADE_REDIS_HOST: ${BLADE_REDIS_HOST:?BLADE_REDIS_HOST is required}
      BLADE_REDIS_PORT: ${BLADE_REDIS_PORT:-6379}
      BLADE_REDIS_PASSWORD: ${BLADE_REDIS_PASSWORD:?BLADE_REDIS_PASSWORD is required}
      BLADE_REDIS_DATABASE: ${BLADE_REDIS_DATABASE:-0}
      BLADE_DATASOURCE_URL: ${BLADE_DATASOURCE_URL:?BLADE_DATASOURCE_URL is required}
      BLADE_DATASOURCE_USERNAME: ${BLADE_DATASOURCE_USERNAME:?BLADE_DATASOURCE_USERNAME is required}
      BLADE_DATASOURCE_PASSWORD: ${BLADE_DATASOURCE_PASSWORD:?BLADE_DATASOURCE_PASSWORD is required}
      BLADE_TOKEN_SIGN_KEY: ${BLADE_TOKEN_SIGN_KEY:?BLADE_TOKEN_SIGN_KEY is required}
      BLADE_TOKEN_CRYPTO_KEY: ${BLADE_TOKEN_CRYPTO_KEY:?BLADE_TOKEN_CRYPTO_KEY is required}
      BLADE_AI_REVERSE_FAST_BASE_URL: ${BLADE_AI_REVERSE_FAST_BASE_URL:-}
      BLADE_AI_REVERSE_FAST_API_KEY: ${BLADE_AI_REVERSE_FAST_API_KEY:-}
      BLADE_AI_REVERSE_TARGET_ENGINE: ${BLADE_AI_REVERSE_TARGET_ENGINE:-}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${DISCOVERY_IP:?DISCOVERY_IP is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: ${DISCOVERY_PORT:-8107}
    ports:
      - ${AI_BIND_ADDRESS:-0.0.0.0}:${AI_PORT:-8107}:8107
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
