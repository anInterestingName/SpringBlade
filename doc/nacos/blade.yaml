#服务器配置
server:
  tomcat:
    # 线程配置
    threads:
      # 最大工作线程数(可同时处理请求的线程上限)
      max: 400
      # 最小空闲工作线程数(保持存活的常驻线程数)
      min-spare: 16

#spring配置
spring:
  cloud:
    sentinel:
      eager: true
  devtools:
    restart:
      log-condition-evaluation-delta: false
    livereload:
      port: 23333

#feign配置
feign:
  sentinel:
    enabled: true

#对外暴露端口
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

#springdoc-openapi配置
springdoc:
  default-flat-param-object: true

#swagger配置信息
swagger:
  title: SpringBlade 接口文档系统
  description: SpringBlade 接口文档系统
  version: 5.0.1
  license: Powered By SpringBlade
  licenseUrl: https://bladex.cn
  terms-of-service-url: https://bladex.cn
  contact:
    name: smallchill
    email: bladejava@qq.com
    url: https://gitee.com/smallc

#blade配置
blade:
  # 授权与认证中心配置
  authorization:
    # 所有业务服务统一使用标准 OAuth2 Resource Server。
    resource:
      enabled: ${AUTHORIZATION_RESOURCE_ENABLED:true}
      issuer: ${AUTHORIZATION_ISSUER:http://127.0.0.1:8100}
      jwk-set-uri: ${AUTHORIZATION_JWK_SET_URI:${blade.authorization.resource.issuer}/oauth2/jwks}
      audience: ${AUTHORIZATION_RESOURCE_AUDIENCE:${spring.application.name}}
      required-scope: ${AUTHORIZATION_RESOURCE_REQUIRED_SCOPE:service.read}
      skip-url:
        - /actuator/health/**
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
    client:
      enabled: ${AUTHORIZATION_CLIENT_ENABLED:true}
      issuer: ${AUTHORIZATION_ISSUER:http://127.0.0.1:8100}
      client-id: ${AUTHORIZATION_SERVICE_CLIENT_ID:${spring.application.name}}
      client-secret: ${AUTHORIZATION_SERVICE_CLIENT_SECRET:}
      scopes: ${AUTHORIZATION_SERVICE_CLIENT_SCOPES:service.read}
  registration:
    enabled: false
    default-tenant-id: "000000"
    captcha-enabled: true
    account-min-length: 4
    account-max-length: 32
    password-min-length: 8
    password-max-length: 64
    rate-limit:
      ip-window-seconds: 60
      ip-max-attempts: 10
      tenant-window-seconds: 60
      tenant-max-attempts: 30
      account-window-seconds: 600
      account-max-attempts: 3
  #jackson配置
  jackson:
    #null自动转空值
    null-to-empty: true
    #大数字自动转字符串
    big-num-to-string: true
    #支持text文本请求,与报文加密同时开启
    support-text-plain: false
    #视图配置
    view:
      #动态模式的默认视图
      default-view: summary
      #角色→视图映射
      role-mapping:
        administrator: administrator
        admin: admin
        user: detail
        guest: summary
  xss:
    enabled: true
    skip-url:
      - /weixin
  secure:
    skip-url:
      - /test/**
    client:
      - client-id: sword
        path-patterns:
          - /sword/**
      - client-id: saber
        path-patterns:
          - /saber/**
  tenant:
    column: tenant_id
    tables:
      - blade_notice
      - blade_ai_prompt
      - blade_ai_prompt_version
      - blade_tag_category
      - blade_tag
      - blade_ai_provider_config
      - blade_ai_model_config

